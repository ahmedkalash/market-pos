<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Market POS - Premium Terminal</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: {
                            50: '#fffbeb',
                            100: '#fef3c7',
                            200: '#fde68a',
                            300: '#fcd34d',
                            400: '#fbbf24',
                            500: '#f59e0b', // Filament Amber Default
                            600: '#d97706',
                            700: '#b45309',
                            800: '#92400e',
                            900: '#78350f',
                            950: '#451a03',
                        },
                        gray: {
                            50: '#fafafa',
                            100: '#f4f4f5',
                            200: '#e4e4e7',
                            300: '#d4d4d8',
                            400: '#a1a1aa',
                            500: '#71717a', // Filament Zinc Default
                            600: '#52525b',
                            700: '#3f3f46',
                            800: '#27272a',
                            900: '#18181b',
                            950: '#09090b',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <!-- Inter Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        /* Minimalist Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #e4e4e7; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #a1a1aa; }
        
        /* Tooltip styling */
        .tooltip-btn { position: relative; }
        .tooltip-btn[title]:hover::after {
            content: attr(title);
            position: absolute;
            top: 100%;
            left: 50%;
            transform: translateX(-50%);
            margin-top: 8px;
            background: #18181b;
            color: #fff;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 12px;
            white-space: nowrap;
            z-index: 50;
            pointer-events: none;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body class="bg-gray-100 text-gray-900 h-screen w-screen overflow-hidden flex flex-col" x-data="posSystem()">

    <!-- Header / Top Bar -->
    <header class="bg-white border-b border-gray-200 h-[68px] flex items-center justify-between px-6 shrink-0 z-10 shadow-sm">
        
        <!-- Right: Branding (RTL context) -->
        <div class="flex items-center gap-3 shrink-0 w-64 justify-end">
            <h1 class="text-[19px] font-bold tracking-tight text-gray-900">Market POS <span class="font-normal text-gray-400 mx-1">|</span> <span class="font-semibold text-gray-500 text-lg">مول سوبرماركت</span></h1>
            <div class="w-10 h-10 bg-gradient-to-br from-primary-400 to-primary-600 rounded-lg flex items-center justify-center text-white font-extrabold text-xl shadow-inner border border-primary-600">
                M
            </div>
        </div>

        <!-- Center: Unified Search -->
        <div class="flex-1 max-w-2xl mx-8 relative group">
            <div class="absolute inset-y-0 right-0 pl-3 flex items-center pointer-events-none transition-colors group-focus-within:text-primary-500">
                <svg class="h-[22px] w-[22px] text-gray-400 ml-4 group-focus-within:text-primary-500 transition-colors" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                </svg>
            </div>
            <input type="text" 
                   x-model="searchQuery"
                   class="w-full bg-gray-100 border-2 border-transparent focus:border-primary-500 focus:bg-white focus:shadow-md rounded-full py-3 px-12 pr-12 outline-none transition-all shadow-inner text-[15px] font-medium placeholder:text-gray-400" 
                   placeholder="البحث برقم الباركود أو اسم المنتج...">
            
            <div class="absolute inset-y-0 left-0 flex items-center pr-3">
                <!-- Keyboard shortcut hint -->
                <span class="text-xs font-bold text-gray-400 border-2 border-gray-200 rounded-md px-2 py-0.5 mr-4 bg-white shadow-sm">F3</span>
            </div>
        </div>

        <!-- Left: Cashier Actions & Profile -->
        <div class="flex items-center gap-2.5 shrink-0">
            <!-- Walk-in Customer Selection -->
            <button @click="showCustomers = true" class="flex items-center gap-2 bg-white border border-gray-200 hover:bg-gray-50 hover:border-gray-300 rounded-full py-1.5 px-4 transition-all shadow-sm">
                <div class="w-2.5 h-2.5 rounded-full bg-green-500 shadow-[0_0_8px_rgba(34,197,94,0.6)] animate-pulse"></div>
                <span class="text-[14px] font-semibold text-gray-700" x-text="selectedCustomer"></span>
                <svg class="w-4 h-4 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 9l-7 7-7-7" /></svg>
            </button>

            <div class="h-8 w-px bg-gray-200 mx-1.5"></div>

            <!-- Quick Action Icons (Heroicons) -->
            <div class="flex items-center gap-1">
                <!-- Quick Add Customer -->
                <button class="p-2 text-gray-500 hover:text-primary-600 hover:bg-primary-50 rounded-full tooltip-btn transition-colors" title="إضافة عميل سريع">
                    <svg class="w-[22px] h-[22px]" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z" /></svg>
                </button>
                <!-- Today's Sales -->
                <button class="p-2 text-gray-500 hover:text-primary-600 hover:bg-primary-50 rounded-full tooltip-btn transition-colors" title="مبيعات اليوم">
                    <svg class="w-[22px] h-[22px]" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                </button>
                <!-- Return Mode -->
                <button class="p-2 text-gray-500 hover:text-red-600 hover:bg-red-50 rounded-full tooltip-btn transition-colors" title="وضع الإرجاع">
                    <svg class="w-[22px] h-[22px]" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h10a8 8 0 018 8v2M3 10l6 6m-6-6l6-6" /></svg>
                </button>
                <!-- POS Settings -->
                <button class="p-2 text-gray-500 hover:text-gray-900 hover:bg-gray-100 rounded-full tooltip-btn transition-colors" title="إعدادات الكاشير">
                    <svg class="w-[22px] h-[22px]" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /></svg>
                </button>
                <!-- Language (Globe) -->
                <button class="p-2 text-gray-500 hover:text-gray-900 hover:bg-gray-100 rounded-full tooltip-btn transition-colors" title="اللغة / Language">
                    <svg class="w-[22px] h-[22px]" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 01-9 9m9-9a9 9 0 00-9-9m9 9H3m9 9a9 9 0 01-9-9m9 9c1.657 0 3-4.03 3-9s-1.343-9-3-9m0 18c-1.657 0-3-4.03-3-9s1.343-9 3-9m-9 9a9 9 0 019-9" /></svg>
                </button>
                <!-- Display (Secondary Screen) -->
                <button class="p-2 text-gray-500 hover:text-gray-900 hover:bg-gray-100 rounded-full tooltip-btn transition-colors" title="شاشة العميل">
                    <svg class="w-[22px] h-[22px]" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" /></svg>
                </button>
                <!-- Calculator Pop-up -->
                <button @click="showCalculator = true" class="p-2 text-gray-500 hover:text-gray-900 hover:bg-gray-100 rounded-full tooltip-btn transition-colors" title="آلة حاسبة">
                    <svg class="w-[22px] h-[22px]" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 7h6m0 10v-3m-3 3h.01M9 17h.01M9 14h.01M12 14h.01M15 11h.01M12 11h.01M9 11h.01M7 21h10a2 2 0 002-2V5a2 2 0 00-2-2H7a2 2 0 00-2 2v14a2 2 0 002 2z" /></svg>
                </button>
                <!-- Fullscreen -->
                <button class="p-2 text-gray-500 hover:text-gray-900 hover:bg-gray-100 rounded-full tooltip-btn transition-colors" title="ملء الشاشة">
                    <svg class="w-[22px] h-[22px]" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4" /></svg>
                </button>
            </div>

            <!-- Profile Badge -->
            <button class="ml-2 w-10 h-10 rounded-full bg-white border-2 border-gray-200 shadow-sm overflow-hidden flex items-center justify-center hover:border-primary-500 transition-colors">
                <img src="https://ui-avatars.com/api/?name=Ahmed+M&background=f4f4f5&color=18181b" alt="Profile" class="w-full h-full object-cover">
            </button>
        </div>
    </header>

    <!-- Main Workspace -->
    <main class="flex-1 flex overflow-hidden p-5 gap-6">
        
        <!-- Left Area: Catalog (Takes remaining width) -->
        <section class="flex-[1.2] flex flex-col min-w-0">
            <!-- Categories Ribbon -->
            <div class="flex items-center gap-3 overflow-x-auto pb-5 shrink-0 px-1 scroll-smooth hide-scroll">
                <template x-for="cat in categories" :key="cat.id">
                    <button @click="activeCategory = cat.id"
                            class="whitespace-nowrap px-6 py-2.5 rounded-xl text-[15px] font-semibold transition-all duration-200"
                            :class="activeCategory === cat.id ? 'bg-primary-500 text-white shadow-lg shadow-primary-500/30' : 'bg-white text-gray-600 hover:bg-gray-50 hover:text-gray-900 border border-gray-200 shadow-sm'">
                        <span x-text="cat.name"></span>
                    </button>
                </template>
            </div>

            <!-- Products Grid -->
            <div class="flex-1 overflow-y-auto px-1 pb-4">
                <div class="grid grid-cols-2 sm:grid-cols-3 xl:grid-cols-4 gap-5">
                    <template x-for="product in filteredProducts" :key="product.id">
                        <div @click="addToCart(product)" 
                             class="bg-white rounded-2xl shadow-sm hover:shadow-xl hover:shadow-gray-200/50 border border-gray-100 overflow-hidden cursor-pointer transition-all duration-300 group flex flex-col h-full hover:-translate-y-1 active:translate-y-0">
                            <!-- Product Image Placeholder -->
                            <div class="h-36 w-full p-2.5 pb-0 relative">
                                <div class="w-full h-full rounded-[14px] flex items-center justify-center transition-transform duration-500 group-hover:scale-[1.03]" :class="product.color">
                                    <svg class="w-14 h-14 text-white opacity-40 mix-blend-overlay" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" /></svg>
                                </div>
                                <div class="absolute inset-0 bg-black/0 group-hover:bg-black/5 transition-colors rounded-[14px] m-2.5"></div>
                            </div>
                            <!-- Product Details -->
                            <div class="p-4 flex-1 flex flex-col">
                                <h3 class="font-bold text-gray-900 text-[15px] leading-snug line-clamp-2" x-text="product.name"></h3>
                                <span class="text-[13px] text-gray-400 mt-1 font-medium" x-text="product.sku"></span>
                                <div class="mt-auto pt-4 flex items-center justify-between">
                                    <span class="font-extrabold text-gray-900 text-lg tracking-tight" x-text="formatMoney(product.price)"></span>
                                    <div class="w-9 h-9 rounded-xl bg-gray-50 border border-gray-100 group-hover:bg-primary-50 group-hover:border-primary-200 text-gray-400 group-hover:text-primary-600 flex items-center justify-center transition-all duration-300 group-hover:rotate-90">
                                        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4" /></svg>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </template>
                </div>
            </div>
        </section>

        <!-- Right Area: Cart Sidebar (Fixed width) -->
        <aside class="flex-1 bg-white rounded-[24px] shadow-xl shadow-gray-200/50 border border-gray-200 flex flex-col shrink-0 overflow-hidden relative z-10">
            <!-- Header -->
            <div class="px-6 py-5 border-b border-gray-100 flex items-center justify-between bg-gradient-to-b from-gray-50 to-white">
                <button @click="clearCart()" class="flex items-center gap-1.5 text-red-500 hover:text-red-700 hover:bg-red-50 px-3 py-2 rounded-xl transition-all duration-200 text-[14px] font-bold group">
                    <svg class="w-[18px] h-[18px] transition-transform duration-300 group-hover:-translate-y-0.5 group-hover:rotate-12" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>
                    <span>إفراغ السلة</span>
                </button>
                <div class="flex items-center gap-3">
                    <span class="bg-primary-100/80 text-primary-800 text-[13px] font-extrabold px-3 py-1.5 rounded-full shadow-sm" x-text="cartItemCount + ' منتجات'"></span>
                    <h2 class="text-xl font-extrabold text-gray-900 tracking-tight">سلة المشتريات</h2>
                </div>
            </div>

            <!-- Items List -->
            <div class="flex-1 overflow-y-auto p-4 bg-gray-50/50">
                <template x-if="cart.length === 0">
                    <div class="h-full flex flex-col items-center justify-center text-gray-400 p-6 text-center">
                        <svg class="w-20 h-20 mb-5 text-gray-200" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z" /></svg>
                        <p class="text-[17px] font-extrabold text-gray-500">سلة المشتريات فارغة</p>
                        <p class="text-[14px] mt-2 font-medium">ابدأ بمسح باركود أو اضافة منتجات من القائمة</p>
                    </div>
                </template>
                <div class="flex flex-col gap-2.5">
                    <template x-for="item in cart" :key="item.id">
                        <!-- Cart Item Row -->
                        <div class="flex items-center justify-between p-4 bg-white border border-gray-100 rounded-[16px] hover:border-gray-200 hover:shadow-md shadow-sm transition-all duration-300 group">
                            
                            <!-- Left: Total & Actions (RTL means visual left, DOM start) -->
                            <div class="flex flex-col items-start justify-center gap-2.5 shrink-0 w-[95px] border-r border-gray-100 pr-4">
                                <span class="font-extrabold text-gray-900 text-[16px] tracking-tight" x-text="formatMoney(item.price * item.qty)"></span>
                                <div class="flex items-center gap-1.5 opacity-40 group-hover:opacity-100 transition-opacity duration-300">
                                    <!-- Discount Line Item -->
                                    <button class="p-1.5 bg-gray-50 border border-gray-100 text-gray-500 hover:text-primary-600 hover:bg-primary-50 hover:border-primary-100 rounded-lg transition-colors" title="خصم على الصنف">
                                        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M7 21l10-18m-8 4h.01M15 16h.01" /></svg>
                                    </button>
                                    <!-- Remove -->
                                    <button @click="removeFromCart(item.id)" class="p-1.5 bg-gray-50 border border-gray-100 text-gray-500 hover:text-red-600 hover:bg-red-50 hover:border-red-100 rounded-lg transition-colors" title="حذف">
                                        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12" /></svg>
                                    </button>
                                </div>
                            </div>

                            <!-- Right: Controls & Info -->
                            <div class="flex items-center flex-1 justify-end gap-4 min-w-0 pr-1">
                                <!-- Info -->
                                <div class="text-right flex-1 min-w-0">
                                    <h4 class="font-extrabold text-gray-900 text-[14.5px] truncate" x-text="item.name"></h4>
                                    <div class="text-[13px] text-gray-500 mt-1 truncate">
                                        <span class="font-medium" x-text="item.sku"></span> <span class="mx-1 text-gray-300">|</span> <span class="font-bold text-gray-700" x-text="formatMoney(item.price)"></span>
                                    </div>
                                </div>
                                <!-- Quantity Spinner -->
                                <div class="flex flex-col items-center bg-gray-50 rounded-xl border border-gray-200 overflow-hidden shadow-inner shrink-0">
                                    <button @click="updateQty(item, 1)" class="w-10 h-8 flex items-center justify-center text-gray-500 hover:text-gray-900 hover:bg-gray-200 font-bold transition-colors">+</button>
                                    <div class="w-10 h-8 flex items-center justify-center bg-white font-extrabold text-gray-900 text-[16px] border-y border-gray-200 shadow-sm z-10" x-text="item.qty"></div>
                                    <button @click="updateQty(item, -1)" class="w-10 h-8 flex items-center justify-center text-gray-500 hover:text-gray-900 hover:bg-gray-200 font-bold transition-colors">-</button>
                                </div>
                            </div>

                        </div>
                    </template>
                </div>
            </div>

            <!-- Summary & Payment Footer -->
            <div class="bg-white border-t border-gray-100 p-6 shrink-0 flex flex-col gap-3 shadow-[0_-10px_20px_-10px_rgba(0,0,0,0.05)] relative z-20">
                
                <!-- Subtotals -->
                <div class="flex justify-between items-center text-[15px] text-gray-600">
                    <span class="font-bold text-gray-800" x-text="formatMoney(subtotal)"></span>
                    <span class="font-semibold">المجموع الفرعي (Subtotal)</span>
                </div>
                <div class="flex justify-between items-center text-[15px] text-gray-600">
                    <span class="font-bold text-gray-800" x-text="formatMoney(shipping)"></span>
                    <span class="font-semibold">الشحن (Shipping)</span>
                </div>
                
                <!-- Total Discount Input -->
                <div class="flex justify-between items-center text-[15px] mt-1">
                    <div class="flex items-center gap-1.5 bg-gray-50 border-2 border-gray-100 rounded-xl overflow-hidden h-10 w-32 focus-within:border-primary-500 focus-within:ring-2 focus-within:ring-primary-500/20 transition-all">
                        <span class="pl-3 text-gray-400 font-extrabold text-lg">%</span>
                        <input type="number" x-model="discountPercent" class="w-full bg-transparent text-left outline-none pr-4 font-extrabold text-gray-900 text-[16px]" min="0" max="100">
                    </div>
                    <span class="font-bold text-gray-700">خصم إجمالي (Discount)</span>
                </div>

                <!-- Divider -->
                <div class="w-full border-t border-dashed border-gray-300 my-2"></div>

                <!-- Grand Total -->
                <div class="flex justify-between items-end mb-2">
                    <span class="text-[34px] font-black text-gray-900 tracking-tight leading-none" x-text="formatMoney(total)"></span>
                    <span class="text-[19px] font-black text-gray-900 pb-1">الإجمالي (Total)</span>
                </div>

                <!-- Action Buttons -->
                <div class="flex items-center gap-2.5 mt-1">
                    <button class="flex-1 bg-white border-2 border-gray-200 text-gray-700 hover:bg-gray-50 hover:border-gray-300 font-extrabold py-4 rounded-xl transition-all shadow-sm flex items-center justify-center gap-2 group">
                        <span class="text-[15px]">تعليق</span>
                        <span class="text-xl group-hover:scale-110 transition-transform">⏸️</span>
                    </button>
                    <button class="flex-1 bg-white border-2 border-gray-200 text-gray-700 hover:bg-gray-50 hover:border-gray-300 font-extrabold py-4 rounded-xl transition-all shadow-sm flex items-center justify-center gap-2 group">
                        <span class="text-[15px]">مسودات</span>
                        <span class="text-xl group-hover:scale-110 transition-transform">📋</span>
                    </button>
                    <button class="flex-[1.8] bg-primary-500 hover:bg-primary-600 text-white font-black py-4 rounded-xl transition-all shadow-lg shadow-primary-500/30 text-xl flex items-center justify-center gap-2 active:scale-[0.98]">
                        <span>دفع نقدي</span>
                        <svg class="w-[26px] h-[26px]" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M14 5l7 7m0 0l-7 7m7-7H3" /></svg>
                    </button>
                </div>
            </div>
        </aside>
    </main>

    <script>
        document.addEventListener('alpine:init', () => {
            Alpine.data('posSystem', () => ({
                searchQuery: '',
                activeCategory: 0,
                selectedCustomer: 'عميل نقدي (Walk-in)',
                showCustomers: false,
                showCalculator: false,
                discountPercent: 0,
                shipping: 0,
                categories: [
                    { id: 0, name: 'الكل (All Categories)' },
                    { id: 1, name: 'عصائر (Juices)' },
                    { id: 2, name: 'ألبان (Dairy)' },
                    { id: 3, name: 'مشروبات (Beverages)' },
                    { id: 4, name: 'وجبات خفيفة (Snacks)' },
                    { id: 5, name: 'منظفات (Cleaning)' },
                ],
                products: [
                    { id: 1, cat_id: 3, name: "شاي العروسة 250جم بعبوة اقتصادية", sku: "SKU 1029", price: 30.00, color: "bg-red-500" },
                    { id: 2, cat_id: 3, name: "نسكافيه جولد 100جم", sku: "SKU 1030", price: 120.00, color: "bg-amber-700" },
                    { id: 3, cat_id: 3, name: "مياه معدنية 1.5 لتر", sku: "SKU 1031", price: 8.00, color: "bg-sky-400" },
                    { id: 4, cat_id: 2, name: "جبنة بيضاء 500جم", sku: "SKU 1032", price: 45.00, color: "bg-yellow-300" },
                    { id: 5, cat_id: 4, name: "سكر الأسرة 1 كجم", sku: "SKU 1033", price: 40.00, color: "bg-gray-300" },
                    { id: 6, cat_id: 4, name: "شيبسي عائلي طعم الجبنة", sku: "SKU 1034", price: 25.00, color: "bg-yellow-500" },
                    { id: 7, cat_id: 3, name: "بيبسي كانز 330مل", sku: "SKU 1035", price: 12.00, color: "bg-blue-600" },
                    { id: 8, cat_id: 2, name: "حليب كامل الدسم مراعي 1 لتر", sku: "SKU 1036", price: 35.00, color: "bg-indigo-300" },
                    { id: 9, cat_id: 1, name: "عصير برتقال بيتي 1 لتر", sku: "SKU 1037", price: 22.00, color: "bg-orange-500" },
                    { id: 10, cat_id: 5, name: "مسحوق غسيل اريال 2.5كجم", sku: "SKU 1038", price: 185.00, color: "bg-emerald-500" },
                ],
                cart: [
                    { id: 8, name: "حليب كامل الدسم مراعي 1 لتر", sku: "SKU 1036", qty: 2, price: 35.00 },
                    { id: 5, name: "سكر الأسرة 1 كجم", sku: "SKU 1033", qty: 1, price: 40.00 },
                    { id: 1, name: "شاي العروسة 250جم بعبوة اقتصادية", sku: "SKU 1029", qty: 1, price: 30.00 },
                ],
                
                get filteredProducts() {
                    let result = this.products;
                    if (this.activeCategory !== 0) {
                        result = result.filter(p => p.cat_id === this.activeCategory);
                    }
                    if (this.searchQuery) {
                        const q = this.searchQuery.toLowerCase();
                        result = result.filter(p => p.name.toLowerCase().includes(q) || p.sku.toLowerCase().includes(q));
                    }
                    return result;
                },

                get cartItemCount() {
                    return this.cart.reduce((total, item) => total + item.qty, 0);
                },

                get subtotal() {
                    return this.cart.reduce((total, item) => total + (item.price * item.qty), 0);
                },

                get total() {
                    let total = this.subtotal + this.shipping;
                    // Protect against invalid inputs
                    let disc = parseFloat(this.discountPercent) || 0;
                    if(disc > 100) disc = 100;
                    if(disc < 0) disc = 0;
                    
                    let discountAmount = total * (disc / 100);
                    return Math.max(0, total - discountAmount);
                },

                formatMoney(amount) {
                    return new Intl.NumberFormat('en-US', { style: 'currency', currency: 'EGP' }).format(amount);
                },

                addToCart(product) {
                    const existingItem = this.cart.find(i => i.id === product.id);
                    if (existingItem) {
                        existingItem.qty++;
                    } else {
                        // Add to top of cart (RTL behavior usually places newest at top)
                        this.cart.unshift({
                            id: product.id,
                            name: product.name,
                            sku: product.sku,
                            price: product.price,
                            qty: 1
                        });
                    }
                },

                updateQty(item, change) {
                    item.qty += change;
                    if (item.qty <= 0) {
                        this.removeFromCart(item.id);
                    }
                },

                removeFromCart(id) {
                    this.cart = this.cart.filter(i => i.id !== id);
                },

                clearCart() {
                    if(this.cart.length === 0) return;
                    if(confirm('هل أنت متأكد من إفراغ السلة بالكامل؟')) {
                        this.cart = [];
                        this.discountPercent = 0;
                    }
                }
            }));
        });
    </script>
</body>
</html>
